name: Offset pipeline

on:
  workflow_dispatch:
    inputs:
      ob_label:
        description: "OB label (e.g. OB56)"
        required: true
        default: "OB56"
  push:
    paths:
      - "dumps/**"

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve offsets from dumps/
        run: |
          python3 scripts/offset_pipeline/resolve_offsets.py \
            --dumps-dir dumps \
            --ob "${{ inputs.ob_label || 'current' }}" \
            --out app/src/main/jni/generated/Offsets_current.h
      - name: Commit if changed
        run: |
          git config user.name "offset-bot"
          git config user.email "offset-bot@users.noreply.github.com"
          git add app/src/main/jni/generated/Offsets_current.h || true
          if git diff --staged --quiet; then
            echo "No offset changes"
          else
            git commit -m "chore(offsets): refresh Offsets_current.h (${{ inputs.ob_label || 'dumps' }})"
            git push
          fi
