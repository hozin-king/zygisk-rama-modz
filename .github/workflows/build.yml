name: Build Root APK + Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  root-apk:
    name: Build Root Injector APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Install Android cmdline-tools + NDK
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget unzip >/dev/null
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
          unzip -q cmdtools.zip -d "$HOME/android-sdk/cmdline-tools"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$HOME/android-sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Accept licenses + install packages
        run: |
          set +e
          yes | sdkmanager --sdk_root=$HOME/android-sdk --licenses >/dev/null
          sdkmanager --sdk_root=$HOME/android-sdk \
            "platform-tools" "build-tools;34.0.0" "platforms;android-34" "ndk;25.2.9519653"
          set -e
          echo "ANDROID_NDK_HOME=$HOME/android-sdk/ndk/25.2.9519653" >> "$GITHUB_ENV"
          echo "sdk.dir=$HOME/android-sdk" > local.properties
          cat local.properties

      - name: Setup Gradle wrapper
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -O /tmp/g.zip
          sudo unzip -q /tmp/g.zip -d /opt
          /opt/gradle-8.5/bin/gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew --version

      - name: Assemble release APK
        run: |
          ./gradlew :root-apk:assembleRelease --no-daemon --stacktrace
          mkdir -p dist
          find root-apk/build/outputs/apk -name '*.apk' -exec cp -v {} dist/ \;
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: RAMA_MODZ-RootAPK
          path: dist/*.apk
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [root-apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-assets
          find artifacts -name '*.apk' -exec cp -v {} release-assets/ \;
          VER=$(grep '^version=' module.prop | cut -d= -f2 | tr -d '\r')
          TAG="v${VER}-root-$(date -u +%Y%m%d%H%M)"
          test -n "$(ls -A release-assets)" || exit 1
          gh release create "$TAG" release-assets/* \
            --title "RAMA MODZ Root APK $TAG" \
            --notes "Root injector APK (Zygisk CI off). Credits: RAMA MODZ." \
            --latest
