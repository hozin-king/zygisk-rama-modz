name: Build Zygisk Module

on:
  push:
    branches: [main]
    paths:
      - 'app/src/main/jni/**'
      - '.github/workflows/build.yml'
      - 'module.prop'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Android NDK r25c
        run: |
          curl -sSL -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q /tmp/ndk.zip -d /tmp
          /tmp/android-ndk-r25c/ndk-build --version

      - name: ndk-build (arm64-v8a + armeabi-v7a)
        run: |
          cd app/src/main/jni
          /tmp/android-ndk-r25c/ndk-build -j$(nproc) NDK_DEBUG=0
          # ndk-build memakai app/src/main sebagai project path (naik 1 level
          # karena AndroidManifest.xml di sana), jadi output ada di ../libs
          ls -la ../libs/arm64-v8a/libRAMA_MODZ.so ../libs/armeabi-v7a/libRAMA_MODZ.so

      - name: Verify zygisk_module_entry export
        run: |
          for abi in arm64-v8a armeabi-v7a; do
            echo "== $abi =="
            /tmp/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm -D --defined-only app/src/main/libs/$abi/libRAMA_MODZ.so | grep -q " zygisk_module_entry$" && echo "zygisk_module_entry OK" || (echo "zygisk_module_entry MISSING"; exit 1)
          done

      - name: Assemble Zygisk module zip
        run: |
          rm -rf module && mkdir -p module/zygisk
          cp app/src/main/libs/arm64-v8a/libRAMA_MODZ.so module/zygisk/arm64-v8a.so
          cp app/src/main/libs/armeabi-v7a/libRAMA_MODZ.so module/zygisk/armeabi-v7a.so
          cp module.prop module/module.prop
          cat module/module.prop
          cd module && zip -r ../RAMA_MODZ-Zygisk.zip . && cd ..
          unzip -l RAMA_MODZ-Zygisk.zip

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: RAMA_MODZ-Zygisk
          path: RAMA_MODZ-Zygisk.zip
          if-no-files-found: error
