name: Dual Build + Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "zygisk | root-apk | both"
        required: false
        default: "both"
      do_release:
        description: "Create GitHub Release"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  zygisk:
    name: Build Zygisk Module
    if: ${{ github.event_name == 'push' || inputs.mode == 'both' || inputs.mode == 'zygisk' || inputs.mode == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Android NDK r25c
        run: |
          curl -sSL -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q /tmp/ndk.zip -d /tmp
          /tmp/android-ndk-r25c/ndk-build --version

      - name: ndk-build (arm64-v8a + armeabi-v7a)
        run: |
          cd app/src/main/jni
          /tmp/android-ndk-r25c/ndk-build -j$(nproc) NDK_DEBUG=0
          ls -la ../libs/arm64-v8a/libRAMA_MODZ.so ../libs/armeabi-v7a/libRAMA_MODZ.so

      - name: Verify zygisk_module_entry
        run: |
          NM=/tmp/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm
          for abi in arm64-v8a armeabi-v7a; do
            echo "== $abi =="
            $NM -D --defined-only app/src/main/libs/$abi/libRAMA_MODZ.so | grep -q " zygisk_module_entry$" \
              && echo "zygisk_module_entry OK" || (echo "MISSING"; exit 1)
          done

      - name: Package Zygisk zip
        run: bash scripts/package_zygisk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: RAMA_MODZ-Zygisk
          path: dist/RAMA_MODZ-Zygisk.zip
          if-no-files-found: error

  root-apk:
    name: Build Root Injector APK
    if: ${{ github.event_name == 'push' || inputs.mode == 'both' || inputs.mode == 'root-apk' || inputs.mode == '' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Install Android cmdline-tools
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget unzip >/dev/null
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
          unzip -q cmdtools.zip -d "$HOME/android-sdk/cmdline-tools"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: SDK licenses + packages
        run: |
          set +e
          yes | sdkmanager --sdk_root=$HOME/android-sdk --licenses >/dev/null
          sdkmanager --sdk_root=$HOME/android-sdk "platform-tools" "build-tools;34.0.0" "platforms;android-34" "ndk;25.2.9519653"
          set -e
          echo "SDK ready"

      - name: Package Root APK
        run: bash scripts/package_root_apk.sh
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - uses: actions/upload-artifact@v4
        with:
          name: RAMA_MODZ-RootAPK
          path: dist/*
          if-no-files-found: warn

  release:
    name: GitHub Release
    needs: [zygisk, root-apk]
    if: always() && (github.event_name == 'push' || inputs.do_release != false)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.zip' -o -name '*.apk' \) -exec cp -v {} release-assets/ \; || true
          ls -la release-assets/ || true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(grep '^version=' module.prop | cut -d= -f2 | tr -d '\r')
          TAG="v${VER}-$(date -u +%Y%m%d%H%M)"
          if [ -z "$(ls -A release-assets 2>/dev/null)" ]; then
            echo "Skip release — no artifacts"
            exit 0
          fi
          gh release create "$TAG" release-assets/* \
            --title "RAMA MODZ $TAG" \
            --notes "Zygisk module + Root injector APK. Credits: RAMA MODZ. Offsets: app/src/main/jni/generated/Offsets_current.h" \
            --latest
